<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Research Opportunity Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Research Opportunity Portal</h1>
        <p>Explore available university research opportunities</p>
    </header>

    <main>

        <!-- Add Opportunity Section -->
        <section class="form-section">

            <h2>Add Research Opportunity</h2>

            <form id="opportunityForm">

                <label for="title">Research Title</label>
                <input type="text" id="title" name="title" required>

                <label for="description">Research Description</label>
                <textarea id="description" name="description" required></textarea>

                <label for="research_area">Research Area</label>
                <input type="text" id="research_area" name="research_area" required>

                <label for="faculty_name">Faculty Member Name</label>
                <input type="text" id="faculty_name" name="faculty_name" required>

                <label for="department">Department</label>
                <input type="text" id="department" name="department" required>

                <label for="required_skills">Required Skills</label>
                <input type="text" id="required_skills" name="required_skills" required>

                <label for="available_positions">Available Positions</label>
                <input
                    type="number"
                    id="available_positions"
                    name="available_positions"
                    min="1"
                    required
                >

                <label for="application_deadline">Application Deadline</label>
                <input
                    type="date"
                    id="application_deadline"
                    name="application_deadline"
                    required
                >

                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Open">Open</option>
                    <option value="Closed">Closed</option>
                </select>

                <button type="submit">Create Opportunity</button>

            </form>

            <p id="message"></p>

        </section>


        <!-- Research Opportunities Section -->
        <section class="opportunities-section">

            <h2>Research Opportunities</h2>

            <div id="opportunitiesContainer">
                <p>Loading opportunities...</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
